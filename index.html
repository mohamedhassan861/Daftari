<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6A50">
<meta name="description" content="Daftari (دفتري) — متابعة المصروفات والإيرادات والأقساط والجمعيات والسلف">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتري Daftari">
<title>دفتري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600&display=swap">
<style>
/* Layout: single-column phone ledger, sticky month header, bottom tab bar, sheets slide up from the bottom */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E6EAE3; --ink:#17201C; --muted:#5B6962; --line:#D3DAD1;
  --accent:#1D6A50; --accent-ink:#FFFFFF; --accent-soft:#DBEAE2;
  --pos:#1F7A4A; --neg:#B2452D; --neg-soft:#F5E0D9; --warn:#9A6210; --warn-soft:#F5E7CC;
  --scrim:rgba(15,22,19,.45);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#212B27; --ink:#E6EEE9; --muted:#9AABA2; --line:#2C3833;
  --accent:#5FBF98; --accent-ink:#0B1712; --accent-soft:#1C3229;
  --pos:#62C890; --neg:#EF8A70; --neg-soft:#3A221B; --warn:#E3B05A; --warn-soft:#382C15;
  --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#212B27; --ink:#E6EEE9; --muted:#9AABA2; --line:#2C3833;
  --accent:#5FBF98; --accent-ink:#0B1712; --accent-soft:#1C3229;
  --pos:#62C890; --neg:#EF8A70; --neg-soft:#3A221B; --warn:#E3B05A; --warn-soft:#382C15;
  --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month span,.perbtn{min-width:118px;text-align:center;font-weight:500;font-size:14px}
.perbtn{border:0;background:none;cursor:pointer;padding:4px 2px;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.perbtn:hover{color:var(--accent)}
.iconbtn{width:34px;height:34px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
[dir="ltr"] .flip{transform:scaleX(-1)}

main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:18px;padding-block:16px}

/* summary slip */
.slip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip .net{padding:16px 18px 14px;display:flex;flex-direction:column;gap:2px}
.label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.big{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.15}
.big small{font-size:15px;font-weight:400;color:var(--muted);margin-inline-start:6px}
.perf{height:0;border-top:2px dashed var(--line);margin:0 12px}
.slip .split{display:grid;grid-template-columns:1fr 1fr}
.slip .split > div{padding:12px 18px;display:flex;flex-direction:column;gap:2px}
.slip .split > div + div{border-inline-start:1px solid var(--line)}
.mid{font-family:var(--f-display);font-size:19px;font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:500;cursor:pointer;padding:4px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap}
.glyph{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;background:var(--sunk);color:var(--muted)}
.glyph.in{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.daylbl{font-size:12px;color:var(--muted);padding:10px 14px 4px;background:var(--bg)}

.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.danger{color:var(--neg);border-color:var(--neg-soft)}
.btn.block{width:100%;padding:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* obligation cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{margin:0;font-size:16px;font-weight:600;font-family:var(--f-display)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.neg{background:var(--neg)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* reports */
.catbar{display:flex;flex-direction:column;gap:5px;padding:10px 14px}
.catbar + .catbar{border-top:1px solid var(--line)}
.catbar .l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:150px;padding:14px 14px 0}
.cols .c{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.cols .c i{display:block;width:40%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.cols .c i.a{background:var(--accent)} .cols .c i.b{background:var(--neg)}
.colsx{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 14px 12px;font-size:11.5px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:0 14px 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}

/* nav + fab */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent);font-weight:600}
.nav svg{width:22px;height:22px}
.fab{position:fixed;z-index:21;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(18px,calc((100vw - 560px)/2 + 18px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(20,60,45,.28)}
.fab svg{width:26px;height:26px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 8px}
.shh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:sticky;top:-6px;background:var(--surface);z-index:2;padding-top:4px}
.panel h3{margin:0 0 14px;font-family:var(--f-display);font-size:18px;font-weight:600}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > span{font-size:13px;color:var(--muted);font-weight:500}
.in-f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-width:0}
.in-f.amt{font-family:var(--f-display);font-size:22px;font-weight:600}
textarea.in-f{min-height:90px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.foot{display:flex;gap:8px;margin-top:4px}
.foot .grow{flex:1}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;font-size:14px}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.setrow + .setrow{border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:13.5px}
[dir="rtl"] .chip{padding:3px 10px 3px 6px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:99px}
.chip button:hover{background:var(--neg-soft);color:var(--neg)}
.search{display:flex;gap:8px}
.cur{font-size:.72em;font-weight:500;color:var(--muted)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.stmt{width:100%;border-collapse:collapse;font-size:13px}
.stmt th{font-weight:600;color:var(--muted);text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.stmt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.stmt td.n{white-space:nowrap;text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
.stmt td.d{white-space:nowrap;color:var(--muted)}
.stmt tr.tap{cursor:pointer}.stmt tr.tap:hover td{background:var(--sunk)}
.stmt tr.open td{color:var(--muted);font-style:italic}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sumgrid div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
details.box>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary h2{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
details.box>summary h2::before{content:"▸";display:inline-block;margin-inline-end:6px;color:var(--muted);transition:transform .15s}
[dir="rtl"] details.box>summary h2::before{transform:scaleX(-1)}
details.box[open]>summary h2::before{transform:rotate(90deg)}
details.box{display:flex;flex-direction:column;gap:8px}
details.box>.list{margin-top:8px}
.grp{font-size:12px;color:var(--muted);padding:10px 14px 2px;display:flex;justify-content:space-between;gap:8px}
.tile{cursor:pointer}.tile:hover{background:var(--sunk)}
.sub{padding-inline-start:28px}
#txf,#obf{flex-wrap:wrap}

/* lock screen */
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lockmark{width:64px;height:64px;margin:0 auto;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lockmark svg{width:30px;height:30px}
.lockbox .brand{font-size:24px}
.lockbox h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.pin{font-family:var(--f-display);font-size:24px;letter-spacing:.3em;text-align:center}
.err{color:var(--neg);font-size:14px;min-height:21px;margin:0}
.lockbox .form{text-align:start}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div style="display:flex;align-items:center;gap:4px"><button class="iconbtn" id="lockBtn" aria-label="lock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button><button class="iconbtn" id="shareBtn" aria-label="share"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button><div class="brand" id="brand">دفتري</div></div>
  <div class="month">
    <button class="iconbtn" id="mPrev" aria-label="prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="flip"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="mLbl" class="perbtn" type="button"></button>
    <button class="iconbtn" id="mNext" aria-label="next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="flip"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<button class="fab" id="fab" aria-label="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="nav"><div class="in" id="nav"></div></nav>

<div class="sheet" id="sheet" hidden><div class="scrim" id="scrim"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div class="shh"><h3 id="shT"></h3><button class="iconbtn" id="shX" type="button" aria-label="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="shB"></div></div></div>
<div class="toast" id="toast" hidden></div>
<div class="lock" id="lock"><div class="lockbox">
  <div class="lockmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <div class="brand" id="lkBrand">دفتري</div>
  <h3 id="lkT"></h3>
  <p class="hint" id="lkH"></p>
  <form class="form" id="lkF"></form>
  <p class="err" id="lkE"></p>
  <button class="link" id="lkForgot" type="button"></button>
</div></div>

<script>
(function(){
'use strict';
const KEY='daftar-elbeit-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const TODAY_YM=TODAY.slice(0,7);
const ymAdd=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
const ymDiff=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};

/* ---------- strings ---------- */
const T={
app:['دفتري','Daftari'],home:['الرئيسية','Home'],tx:['الحركات','Activity'],obl:['الالتزامات','Obligations'],rep:['التقارير','Reports'],set:['الإعدادات','Settings'],
income:['الإيرادات','Income'],expense:['المصروفات','Spending'],net:['المتبقي من الشهر','Left this month'],inc1:['إيراد','Income'],exp1:['مصروف','Expense'],
dueMonth:['مستحق الشهر ده','Due this month'],nothingDue:['مفيش مستحقات متبقية الشهر ده','Nothing left to pay this month'],
pay:['ادفع','Pay'],receive:['اقبض','Collect'],owedToMe:['ليك عند الناس','Owed to you'],iOwe:['عليك للناس','You owe'],

/* ---------- encryption (PBKDF2 + AES-GCM, all on the device) ---------- */
const VAULT='daftar-elbeit-vault', ITER=310000;
const te=new TextEncoder(), td=new TextDecoder();
const toB64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pin,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{iv:toB64(iv),ct:toB64(ct)}}
async function unseal(key,iv,ct){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(iv)},key,fromB64(ct));return JSON.parse(td.decode(pt))}
let KEYOBJ=null, SALT=null;
const readVault=()=>{try{return JSON.parse(localStorage.getItem(VAULT)||'null')}catch(e){return null}};
let saving=Promise.resolve();
let tokenAsked=0;
function save(){
  if(typeof drv!=='undefined'&&!useWorker()&&drv.linked&&driveReady()&&!hasToken()&&Date.now()-tokenAsked>60000){
    tokenAsked=Date.now();requestToken('').then(()=>scheduleDrive()).catch(()=>{drv.needAuth=true;if(S)render()});
  }
  if(!KEYOBJ||!S)return;const snap=JSON.parse(JSON.stringify(S));const key=KEYOBJ,salt=SALT;
  saving=saving.then(async()=>{const {iv,ct}=await seal(key,snap);try{localStorage.setItem(VAULT,JSON.stringify({v:2,salt:toB64(salt),iter:ITER,iv,ct}));localStorage.setItem('daftar-elbeit-lang',snap.lang)}catch(e){}}).catch(()=>{});
  afterChange();
}

function migrate(){
  if(!S.base)S.base='EGP';
  if(!Array.isArray(S.recur))S.recur=[];
  if(!S.rk)S.rk=toB64(crypto.getRandomValues(new Uint8Array(32)));
  if(!S.rates||typeof S.rates!=='object')S.rates={};
  if(!Array.isArray(S.accounts)||!S.accounts.length)S.accounts=[{id:'cash',type:'cash',name:lng()==='en'?'Cash':'كاش',currency:S.base,opening:0}];
  const ids=new Set(S.accounts.map(a=>a.id));
  for(const x of S.tx)if(!x.acc||!ids.has(x.acc))x.acc=S.accounts[0].id;
  for(const l of S.loans)if(!l.currency)l.currency=S.base;
  for(const o of S.inst)if(!o.currency)o.currency=S.base;
  for(const o of S.gam)if(!o.currency)o.currency=S.base;
  const addCat=(ty,id,ar,en,sys,before)=>{if(!S.cats[ty].some(c=>c.id===id)){const i=S.cats[ty].findIndex(c=>c.id===before);S.cats[ty].splice(i<0?S.cats[ty].length:i,0,{id,ar,en,sys})}};

  if('currency' in S)delete S.currency;
}

async function updateRates(manual){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/'+BASE(),{cache:'no-store'});const j=await r.json();
    if(j.result!=='success'||!j.rates)throw new Error('rates');
    for(const c of CUR.map(x=>x[0]))if(c!==BASE()&&j.rates[c])S.rates[c]=Math.round(1/j.rates[c]*10000)/10000;
    if(j.rates.XAU&&!S.goldManual){const g24=1/j.rates.XAU/31.1035;S.rates.G24=Math.round(g24*100)/100;S.rates.G21=Math.round(g24*21/24*100)/100;S.rates.G18=Math.round(g24*18/24*100)/100}
    S.ratesAt=new Date().toISOString();commit(manual?t('ratesUpdated'):'');
  }catch(e){if(manual)toast(t('ratesFailed'))}
}

/* ---------- recurring entries ---------- */
const FREQS=['weekly','monthly','quarterly','yearly'];
function advance(date,freq,day){
  const d=dOf(date);
  if(freq==='weekly')return iso(new Date(d.getTime()+7*864e5));
  let y=d.getUTCFullYear(),m=d.getUTCMonth()+(freq==='monthly'?1:freq==='quarterly'?3:12);y+=Math.floor(m/12);m=m%12;
  const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return iso(new Date(Date.UTC(y,m,Math.min(day||d.getUTCDate(),last))));
}
function runRecurring(){
  if(!S||!Array.isArray(S.recur))return 0;let n=0;
  for(const r of S.recur){let guard=0;
    while(r.next<=TODAY&&guard++<500){
      if(r.end&&r.next>r.end)break;
      if(!S.accounts.some(a=>a.id===r.tpl.acc))break;
      S.tx.push(Object.assign({},r.tpl,{id:uid(),date:r.next,rec:r.id}));n++;
      r.next=advance(r.next,r.freq,r.day);
    }}
  if(n){save();render();toast(t('recAdded')+' '+n)}
  return n;
}
const freqName=f=>({weekly:t('fWeekly'),monthly:t('fMonthly'),quarterly:t('fQuarterly'),yearly:t('fYearly')})[f]||'';

    <div class="two"><label class="fld"><span>${t('nextOn')}</span><input class="in-f" type="date" id="nx" value="${r.next}"></label>

  });

  XLSXP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=()=>{XLSXP=null;rej(new Error('xlsx'))};document.head.appendChild(sc)});return XLSXP}
async function deliverFile(blob,name){
  let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){
    try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const fileBase=title=>('daftari_'+title).replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_').slice(0,60)+'_'+TODAY;

  ${d.foot&&d.foot.length?`<tfoot>${d.foot.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')}</tfoot>`:''}</table></body></html>`;

  const w=fr.contentWindow;w.document.open();w.document.write(html);w.document.close();

    <tbody>${o.kind!=='flow'?`<tr class="open"><td class="d"></td><td>${t('openBal')}</td><td class="n"></td><td class="n"></td><td class="n">${fmt(Math.abs(o.opening||0))}</td></tr>`:''}${body||`<tr><td colspan="5" class="d" style="text-align:center;padding:16px">${t('noMoves')}</td></tr>`}</tbody></table></div>

const shortDate=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Intl.DateTimeFormat(L(),{day:'numeric',month:'short',year:'2-digit'}).format(new Date(y,m-1,d))};
function accStmt(id){
  const a=accOf(id),[from,to]=perRange();let open=+a.opening||0;const rows=[];
  [...S.tx].sort(byDate).forEach(x=>{
    let dr=0,cr=0,desc;
    if(x.type==='transfer'){
      if(x.acc===a.id){const b=accOf(x.toAcc);dr=+x.amount;desc=t('transfer')+' ← '+(b?b.name+' '+b.currency:'')}
      else if(x.toAcc===a.id){const b=accOf(x.acc);cr=+(x.toAmount??x.amount);desc=t('transfer')+' → '+(b?b.name+' '+b.currency:'')}
      else return;
    }else if(x.acc===a.id){if(x.type==='income')cr=+x.amount;else dr=+x.amount;desc=catPath(x.cat)}
    else return;
    if(x.note)desc+=' · '+x.note;
    if(x.date<from){open+=cr-dr;return}if(x.date>to)return;
    rows.push({date:x.date,desc,dr,cr,tx:x.id});
  });
  stmtSheet({title:a.name+' · '+a.currency,sub:accGroup(a)+' · '+perLabel(),cur:a.currency,kind:'acc',opening:open,rows,acc:a});
}

function personStmt(name){

function oblStmt(k,id){
  const o=(k==='inst'?S.inst:S.gam).find(x=>x.id===id);if(!o)return;const cc=o.currency||BASE(),per1=oblPer(k,o),rows=[];
  const linked=S.tx.filter(x=>x.link&&x.link.id===id&&(x.link.k===k||(k==='gam'&&x.link.k==='gamr')));
  const covered=new Set();
  linked.forEach(x=>{if(x.link.k==='gamr'){rows.push({date:x.date,desc:t('payout'),dr:0,cr:+x.amount,tx:x.id});return}
    const al=x.link.alloc||(x.link.ym?{[x.link.ym]:per1}:{});Object.keys(al).forEach(m=>covered.add(m));
    rows.push({date:x.date,desc:t('payFor')+' '+Object.keys(al).map(monthLbl).join('، '),dr:+x.amount,cr:0,tx:x.id})});
  o.paid.filter(m=>!covered.has(m)).forEach(m=>rows.push({date:m+'-01',desc:t('payFor')+' '+monthLbl(m)+' ('+t('beforeApp')+')',dr:per1,cr:0}));
  if(k==='gam'&&o.received&&!linked.some(x=>x.link.k==='gamr'))rows.push({date:gamPayout(o)+'-01',desc:t('payout'),dr:0,cr:o.share*o.members});
  const total=per1*oblMonths(k,o).length;
  stmtSheet({title:o.name,sub:(k==='inst'?t('installments'):t('gameyas'))+' · '+plainGroup(o),cur:cc,kind:'flow',rows,totalLabel:t('paidLbl'),
    extra:`<div><span class="label">${t('total')}</span><b class="num">${fmt(total)}</b></div><div><span class="label">${t('remaining')}</span><b class="num">${fmt(oblLeft(k,o))}</b></div>`});
}

      if(diff===0){closeSheet();toast(t('matched'));return}

}

let cur=TODAY_YM, tab='home', oblTab='inst', txFilter='all', txQuery='';
/* reporting period: a calendar month, quarter, half-year, year, or a custom date range */
const PMODES={month:1,quarter:3,half:6,year:12};
let per={mode:'month',from:TODAY_YM+'-01',to:TODAY};
const perStart=()=>{const [y,m]=cur.split('-').map(Number),n=PMODES[per.mode]||1;return y+'-'+pad(Math.floor((m-1)/n)*n+1)};
function perRange(){if(per.mode==='custom')return per.from<=per.to?[per.from,per.to]:[per.to,per.from];const s=perStart();return [s+'-01',ymAdd(s,PMODES[per.mode]-1)+'-31']}
function perMonths(){const [a,b]=perRange();const out=[];let m=a.slice(0,7);while(m<=b.slice(0,7)&&out.length<240){out.push(m);m=ymAdd(m,1)}return out}
const txIn=()=>{const [a,b]=perRange();return S.tx.filter(x=>x.date>=a&&x.date<=b)};
const dOf=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
function perFactor(){if(per.mode!=='custom')return PMODES[per.mode];const [a,b]=perRange();return Math.max(1,(dOf(b)-dOf(a))/864e5+1)/30.4375}
function perLabel(){
  const y=cur.slice(0,4),m=+cur.slice(5,7),en=lng()==='en';
  if(per.mode==='month')return monthLbl(cur);
  if(per.mode==='quarter'){const q=Math.floor((m-1)/3)+1;return en?'Q'+q+' '+y:'الربع '+['الأول','التاني','التالت','الرابع'][q-1]+' '+y}
  if(per.mode==='half'){const h=m<=6?1:2;return en?'H'+h+' '+y:'النص '+(h===1?'الأول':'التاني')+' '+y}
  if(per.mode==='year')return y;
  const [a,b]=perRange(),f=new Intl.DateTimeFormat(L(),{day:'numeric',month:'short',timeZone:'UTC'}),g=new Intl.DateTimeFormat(L(),{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  return f.format(dOf(a))+' – '+g.format(dOf(b));
}
function perShift(k){
  if(per.mode==='custom'){const [a,b]=perRange(),len=Math.round((dOf(b)-dOf(a))/864e5)+1;per.from=iso(new Date(dOf(a).getTime()+k*len*864e5));per.to=iso(new Date(dOf(b).getTime()+k*len*864e5));return}
  cur=ymAdd(perStart(),k*PMODES[per.mode]);
}
function periodForm(){
  let mode=per.mode;const y=+cur.slice(0,4),m=+cur.slice(5,7),ty=+TODAY.slice(0,4);

/* ---------- obligations logic ---------- */
const instMonths=it=>Array.from({length:it.count},(_,i)=>ymAdd(it.start,i));
const instNext=it=>instMonths(it).find(m=>!it.paid.includes(m))||null;
const gamMonths=g=>Array.from({length:g.members},(_,i)=>ymAdd(g.start,i));
const gamNext=g=>gamMonths(g).find(m=>!g.paid.includes(m))||null;
const gamPayout=g=>ymAdd(g.start,g.myTurn-1);

const oblPer=(k,o)=>k==='inst'?+o.monthly:+o.share;
const oblMonths=(k,o)=>k==='inst'?instMonths(o):gamMonths(o);
const partOf=(o,m)=>+((o.part||{})[m]||0);
const paidAmt=(k,o)=>o.paid.length*oblPer(k,o)+Object.entries(o.part||{}).filter(([m])=>!o.paid.includes(m)).reduce((v,[,a])=>v+(+a||0),0);
const oblLeft=(k,o)=>oblPer(k,o)*oblMonths(k,o).length-paidAmt(k,o);
/* what is still owed for months up to ym */
function owedUpTo(k,o,ym){return oblMonths(k,o).filter(m=>m<=ym&&!o.paid.includes(m)).reduce((v,m)=>v+oblPer(k,o)-partOf(o,m),0)}
function dueFor(ym){
  const out=[];
  [['inst',S.inst],['gam',S.gam]].forEach(([k,list])=>list.forEach(o=>{
    const un=oblMonths(k,o).filter(m=>m<=ym&&!o.paid.includes(m));
    if(un.length)out.push({k,id:o.id,name:o.name,cur:o.currency,amount:owedUpTo(k,o,ym),late:un.filter(m=>m<ym).length,ym:un[0],partial:un.some(m=>partOf(o,m)>0)});
    if(k==='gam'&&!o.received&&gamPayout(o)<=ym)out.push({k:'gamr',id:o.id,name:o.name,cur:o.currency,amount:o.share*o.members,late:0,ym:gamPayout(o)});
  }));
  return out;
}
/* spread a payment over the oldest unpaid months */
function allocate(k,o,amt){
  const per=oblPer(k,o),alloc={};o.part=o.part||{};
  for(const m of oblMonths(k,o)){
    if(amt<=0.004)break;if(o.paid.includes(m))continue;
    const take=Math.min(per-partOf(o,m),amt);if(take<=0)continue;
    alloc[m]=Math.round(take*100)/100;o.part[m]=partOf(o,m)+take;amt-=take;
    if(o.part[m]>=per-0.004){o.paid.push(m);delete o.part[m]}
  }
  return alloc;
}
function payForm(k,id,recv){
  const list=k==='inst'?S.inst:S.gam,o=list.find(x=>x.id===id);if(!o)return;
  const cc=o.currency||BASE(),accs=S.accounts.filter(a=>a.currency===cc);
  if(!accs.length){toast(t('needAccCur')+' '+cc);return}
  const left=recv?o.share*o.members:Math.round(oblLeft(k,o)*100)/100;
  const def=recv?left:Math.round((owedUpTo(k,o,cur>TODAY_YM?cur:TODAY_YM)||Math.min(oblPer(k,o)-partOf(o,oblMonths(k,o).find(m=>!o.paid.includes(m))||''),left))*100)/100;
  const pa=payAcc(cc)||accs[0].id;
  openSheet((recv?t('collectPay'):t('pay'))+' · '+o.name,`<form class="form" id="f">
    ${recv?'':`<div class="sumgrid"><div><span class="label">${t('dueNow')}</span><b class="num">${fmt(def)} <small class="cur">${esc(curSym(cc))}</small></b></div><div><span class="label">${t('remainingAll')}</span><b class="num">${fmt(left)} <small class="cur">${esc(curSym(cc))}</small></b></div></div>`}
    <label class="fld"><span>${t('amountPaid')} (${esc(curName(cc))})</span><input class="in-f amt num" id="amt" inputmode="decimal" value="${def}"></label>
    <label class="fld"><span>${recv?t('toAcc'):t('fromAcc')}</span><select class="in-f" id="acc">${accs.map(a=>`<option value="${a.id}" ${a.id===pa?'selected':''}>${esc(a.name)} · ${a.currency}</option>`).join('')}</select></label>
    <label class="fld"><span>${t('date')}</span><input class="in-f" type="date" id="dt" value="${TODAY}"></label>
    ${recv?'':`<p class="hint">${t('partialHint')}</p>`}
    <div class="foot"><button class="btn pri grow">${t('save')}</button></div></form>`,r=>{
    setTimeout(()=>r.querySelector('#amt').select(),60);
    r.querySelector('#f').onsubmit=e=>{e.preventDefault();let a=numv(r,'amt');if(a<=0){toast(t('needAmt'));return}
      const acc=val(r,'acc'),date=val(r,'dt')||TODAY;
      if(recv){o.received=true;S.tx.push({id:uid(),acc,type:'income',cat:'gamin',amount:a,date,note:o.name,link:{k:'gamr',id}})}
      else{if(a>left+0.004){toast(t('overLeft')+' '+fmt(left));return}
        const alloc=allocate(k,o,a),ms=Object.keys(alloc);
        S.tx.push({id:uid(),acc,type:'expense',cat:k,amount:a,date,note:o.name+' · '+ms.map(monthShort).join('، ')+(ms.length===1&&alloc[ms[0]]<oblPer(k,o)-0.004?' ('+t('partial')+')':''),link:{k,id,alloc}})}
      closeSheet();commit(t('saved'))};
  });
}
function payInst(id){payForm('inst',id)}
function payGam(id){payForm('gam',id)}
function recvGam(id){const g=S.gam.find(x=>x.id===id);if(!g||g.received)return;payForm('gam',id,true)}
function unlink(tx){if(!tx.link)return;const l=tx.link;
  if(l.k==='gamr'){const g=S.gam.find(x=>x.id===l.id);if(g)g.received=false;return}
  const o=(l.k==='inst'?S.inst:S.gam).find(x=>x.id===l.id);if(!o)return;
  const per=oblPer(l.k,o),alloc=l.alloc||(l.ym?{[l.ym]:per}:{});o.part=o.part||{};
  for(const [m,v] of Object.entries(alloc)){
    let have=o.paid.includes(m)?per:partOf(o,m);o.paid=o.paid.filter(x=>x!==m);
    have=Math.round((have-v)*100)/100;if(have>0.004)o.part[m]=have;else delete o.part[m];
  }
}
function delTx(id){const tx=S.tx.find(x=>x.id===id);if(!tx)return;unlink(tx);if(tx.rcpt&&typeof gToken!=='undefined'&&hasToken())gfetch('/drive/v3/files/'+tx.rcpt,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})}).catch(()=>{});S.tx=S.tx.filter(x=>x.id!==id)}
function undoLast(kind,id){
  const o=(kind==='inst'?S.inst:S.gam).find(x=>x.id===id);if(!o)return;
  const linked=S.tx.filter(x=>x.link&&x.link.k===kind&&x.link.id===id).sort((a,b)=>a.date.localeCompare(b.date));
  if(linked.length)delTx(linked[linked.length-1].id);
  else if(o.paid.length){const sorted=[...o.paid].sort();o.paid=o.paid.filter(m=>m!==sorted[sorted.length-1])}
  commit(t('deleted'));
}

function accBalanceAt(a,date){let b=+a.opening||0;for(const x of S.tx){if(x.date>date)continue;
  if(x.type==='transfer'){if(x.acc===a.id)b-=+x.amount||0;if(x.toAcc===a.id)b+=+(x.toAmount??x.amount)||0}else if(x.acc===a.id)b+=x.type==='income'?+x.amount:-x.amount}return b}

function netWorth(date){
  date=date||TODAY;let assets=0,neg=0;
  S.accounts.forEach(a=>{const v=toBase(accBalanceAt(a,date),a.currency);if(v>=0)assets+=v;else neg+=v});
  const recv=S.loans.filter(l=>l.dir==='lent').reduce((v,l)=>v+toBase(loanLeftAt(l,date),l.currency||BASE()),0);
  const pay=S.loans.filter(l=>l.dir==='borrowed').reduce((v,l)=>v+toBase(loanLeftAt(l,date),l.currency||BASE()),0);
  const obl=date>=TODAY?[...S.inst.map(o=>['inst',o]),...S.gam.map(o=>['gam',o])].reduce((v,[k,o])=>v+(k==='inst'?toBase(oblLeft(k,o),o.currency||BASE()):0),0):0;
  return {assets,neg,recv,pay,obl,net:assets+neg+recv-pay-obl};
}

/* ---------- Google Drive (drive.file scope: the app sees only files it created) ---------- */
const CFG=window.DAFTARI_CONFIG||{};
const DRV_KEY='daftari-drive', DKEEP=100, GAPI='https://www.googleapis.com';
let drv={linked:false,folderId:null,lastUp:null,email:'',needAuth:false,busy:false};
try{Object.assign(drv,JSON.parse(localStorage.getItem(DRV_KEY)||'{}'))}catch(e){}
const drvSave=()=>{try{localStorage.setItem(DRV_KEY,JSON.stringify({linked:drv.linked,folderId:drv.folderId,lastUp:drv.lastUp,email:drv.email}))}catch(e){}};
let gToken=null,gExp=0,gClient=null,drvTimer=null;
const TOK_KEY='daftari-gtoken';
try{const o=JSON.parse(localStorage.getItem(TOK_KEY)||'null');if(o&&o.exp>Date.now()){gToken=o.t;gExp=o.exp}}catch(e){}
const keepToken=()=>{try{gToken?localStorage.setItem(TOK_KEY,JSON.stringify({t:gToken,exp:gExp})):localStorage.removeItem(TOK_KEY)}catch(e){}};
const driveConfigured=()=>!!CFG.googleClientId;
const driveReady=()=>driveConfigured()&&!!(window.google&&google.accounts&&google.accounts.oauth2);
const hasToken=()=>!!gToken&&Date.now()<gExp;
const SCOPE='https://www.googleapis.com/auth/drive.file';
const useWorker=()=>!!CFG.authWorker;
/* long-lived Google grant: kept encrypted with the PIN key, never in backups */
const RT_KEY='daftari-rt';let RT=null;
async function saveRT(){if(!KEYOBJ)return;try{if(RT){localStorage.setItem(RT_KEY,JSON.stringify(await seal(KEYOBJ,{rt:RT})))}else localStorage.removeItem(RT_KEY)}catch(e){}}
async function loadRT(){RT=null;try{const o=JSON.parse(localStorage.getItem(RT_KEY)||'null');if(o&&KEYOBJ)RT=(await unseal(KEYOBJ,o.iv,o.ct)).rt||null}catch(e){}}
function setAccess(j){gToken=j.access_token;gExp=Date.now()+((+j.expires_in||3600)-120)*1000;keepToken();drv.needAuth=false}
async function workerCall(path,body){
  const r=await fetch(CFG.authWorker.replace(/\/+$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error){const e=new Error(j.error||('http '+r.status));e.code=j.error;throw e}
  return j;
}
async function ensureAccess(){
  if(hasToken())return true;
  if(useWorker()&&RT){
    try{setAccess(await workerCall('/refresh',{refresh_token:RT}));return true}
    catch(e){if(e.code==='invalid_grant'){RT=null;await saveRT()}return false}
  }
  return false;
}
function requestCode(selectAccount){
  return new Promise((res,rej)=>{
    if(!driveReady()){rej(new Error('notready'));return}
    const cfg={client_id:CFG.googleClientId,scope:SCOPE,ux_mode:'popup',callback:r=>{r&&r.code?res(r.code):rej(r)},error_callback:e=>rej(e)};
    if(selectAccount)cfg.select_account=true;else if(drv.email)cfg.login_hint=drv.email;
    google.accounts.oauth2.initCodeClient(cfg).requestCode();
  });
}
/* interactive: must run from a tap */
async function authorize(selectAccount){
  if(!useWorker()){await requestToken(selectAccount?'select_account consent':'consent');return}
  const j=await workerCall('/exchange',{code:await requestCode(selectAccount)});
  setAccess(j);
  if(j.refresh_token){RT=j.refresh_token;await saveRT();return}
  /* Google skipped the long-lived grant because an older one exists: clear it so the next tap gets a fresh one */
  try{google.accounts.oauth2.revoke(gToken,()=>{})}catch(e){}
  gToken=null;keepToken();toast(t('driveAgain'));throw new Error('again');
}
function revokeAll(){try{if(driveReady()){if(RT)google.accounts.oauth2.revoke(RT,()=>{});else if(gToken)google.accounts.oauth2.revoke(gToken,()=>{})}}catch(e){}}
function requestToken(prompt){
  return new Promise((res,rej)=>{
    if(!driveReady()){rej(new Error('notready'));return}
    if(!gClient)gClient=google.accounts.oauth2.initTokenClient({client_id:CFG.googleClientId,scope:'https://www.googleapis.com/auth/drive.file',callback:()=>{}});
    gClient.callback=r=>{if(r&&r.access_token){gToken=r.access_token;gExp=Date.now()+((+r.expires_in||3600)-120)*1000;keepToken();drv.needAuth=false;res(gToken)}else rej(r)};
    gClient.error_callback=e=>rej(e);
    const o={prompt};if(drv.email)o.login_hint=drv.email;gClient.requestAccessToken(o);
  });
}
async function gfetch(path,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+gToken},opt.headers||{});
  const r=await fetch(path.startsWith('http')?path:GAPI+path,opt);
  if(r.status===401||r.status===403&&!gToken){gToken=null;keepToken();throw new Error('auth')}
  if(r.status===401){gToken=null;keepToken();throw new Error('auth')}
  if(!r.ok)throw new Error('http '+r.status);
  return r;
}
async function ensureFolder(){
  if(drv.folderId){
    try{const j=await (await gfetch('/drive/v3/files/'+drv.folderId+'?fields=id,trashed')).json();if(!j.trashed)return drv.folderId}
    catch(e){if(e.message==='auth')throw e}
  }
  const q=encodeURIComponent("name='Daftari' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j=await (await gfetch('/drive/v3/files?q='+q+'&fields=files(id)&spaces=drive')).json();
  if(j.files&&j.files.length)drv.folderId=j.files[0].id;
  else{const c=await (await gfetch('/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Daftari',mimeType:'application/vnd.google-apps.folder'})})).json();drv.folderId=c.id}
  drvSave();return drv.folderId;
}
async function driveList(folder,n){
  const q=encodeURIComponent("'"+folder+"' in parents and trashed=false");
  const j=await (await gfetch('/drive/v3/files?q='+q+'&orderBy='+encodeURIComponent('createdTime desc')+'&pageSize='+n+'&fields='+encodeURIComponent('files(id,name,createdTime)')+'&spaces=drive')).json();
  return j.files||[];
}
async function pruneOld(folder){
  const all=await driveList(folder,DKEEP+50);
  for(const f of all.slice(DKEEP)){await gfetch('/drive/v3/files/'+f.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})})}
}
async function driveUpload(){
  if(!drv.email){try{const a=await (await gfetch('/drive/v3/about?fields=user(emailAddress)')).json();drv.email=(a.user&&a.user.emailAddress)||'';drvSave()}catch(x){if(x.message==='auth')throw x}}
  const data=await makeBackup(),folder=await ensureFolder(),bd='pl'+uid();
  const meta=JSON.stringify({name:backupName(),parents:[folder],mimeType:'application/json'});
  const body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+data+'\r\n--'+bd+'--';
  await gfetch(GAPI+'/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});
  drv.lastUp=new Date().toISOString();drvSave();markBackup();
}
async function syncDrive(manual){
  if(!drv.linked||!S||!KEYOBJ||drv.busy)return;
  drv.busy=true;
  if(!(await ensureAccess())){drv.busy=false;drv.needAuth=true;render();return}
  try{await driveUpload();drv.needAuth=false;if(manual)toast(t('driveSaved'))}
  catch(e){
    if(e.message==='auth'&&await ensureAccess()){try{await driveUpload();if(manual)toast(t('driveSaved'))}catch(x){drv.needAuth=x.message==='auth';if(manual&&!drv.needAuth)toast(t('driveErr'))}}
    else if(e.message==='auth'){drv.needAuth=true}else if(manual)toast(t('driveErr'));
  }
  finally{drv.busy=false;if(tab==='set'||drv.needAuth)render()}
}

/* ---------- receipt photos: shrunk, encrypted on the phone, stored in the Drive folder ---------- */
async function rcptKey(){if(!S.rk)S.rk=toB64(crypto.getRandomValues(new Uint8Array(32)));return crypto.subtle.importKey('raw',fromB64(S.rk),'AES-GCM',false,['encrypt','decrypt'])}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',0.8));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadReceipt(tx,file){
  if(!drv.linked){toast(t('rcptNeedDrive'));return}
  try{
    if(!(await ensureAccess())){toast(t('driveNeedAuth'));drv.needAuth=true;render();return}
    const jpg=await shrinkImage(file),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await rcptKey(),await jpg.arrayBuffer());
    const folder=await ensureFolder(),bd='rc'+uid(),meta=JSON.stringify({name:'receipt_'+tx.id+'.bin',parents:[folder],mimeType:'application/octet-stream'});
    const body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/octet-stream\r\n\r\n',iv,new Uint8Array(ct),'\r\n--'+bd+'--']);
    const j=await (await gfetch(GAPI+'/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body})).json();
    const x=S.tx.find(v=>v.id===tx.id);if(x){if(x.rcpt)gfetch('/drive/v3/files/'+x.rcpt,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})}).catch(()=>{});x.rcpt=j.id;commit(t('rcptSaved'))}
  }catch(e){toast(t('rcptFail'))}
}
async function showReceipt(id){
  const x=S.tx.find(v=>v.id===id);if(!x||!x.rcpt)return;
  try{if(!(await ensureAccess())){if(useWorker())await authorize(false);else await requestToken('')}
    const buf=new Uint8Array(await (await gfetch('/drive/v3/files/'+x.rcpt+'?alt=media')).arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},await rcptKey(),buf.slice(12));
    const u=URL.createObjectURL(new Blob([pt],{type:'image/jpeg'}));
    openSheet(t('receipt'),`<div class="form"><img src="${u}" alt="" style="width:100%;border-radius:12px"><button type="button" class="btn block" data-sact="tx" data-id="${x.id}">${t('back')}</button></div>`);
  }catch(e){toast(t('rcptFail'))}
}

/* ---------- share to Google Drive (system share sheet, no Google Cloud needed) ---------- */
const LASTCHG='daftari-lastchange';
function markChange(){try{localStorage.setItem(LASTCHG,new Date().toISOString())}catch(e){}}
function backupDue(){
  let lc=null,lb=null;try{lc=localStorage.getItem(LASTCHG);lb=localStorage.getItem('daftar-elbeit-lastbackup')}catch(e){}
  if(!lc)return false;if(!lb)return Date.now()-new Date(lc).getTime()>3600e3;
  return new Date(lc)>new Date(lb)&&Date.now()-new Date(lb).getTime()>864e5;
}
async function shareBackup(){
  if(!KEYOBJ)return;
  const data=await makeBackup(),name=backupName().replace(/\.json$/,'.txt');
  let file=null;try{file=new File([data],name,{type:'text/plain'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});markBackup();toast(t('saved'));render()}
    catch(e){if(e&&e.name!=='AbortError')toast(t('shareUnsupported'))}
    return;
  }
  toast(t('shareUnsupported'));
  if(await saveToPhone(true))render();
}

/* ---------- lock ---------- */
let fails=0,blockedUntil=0,hiddenAt=0;
function showLock(){
  const vt=readVault(),setup=!vt;
  const de=document.documentElement;de.lang=LANG;de.dir=LANG==='en'?'ltr':'rtl';
  $('#lkBrand').textContent=t('app');
  $('#lkT').textContent=setup?t('setupTitle'):t('lockTitle');
  $('#lkH').textContent=setup?t('setupHint'):'';
  $('#lkE').textContent='';
  $('#lkF').innerHTML=`<input class="in-f pin" type="password" inputmode="numeric" autocomplete="off" id="lp1" aria-label="${t('pin1')}" placeholder="${t('pin1')}">
    ${setup?`<input class="in-f pin" type="password" inputmode="numeric" autocomplete="off" id="lp2" aria-label="${t('pin2')}" placeholder="${t('pin2')}">`:''}
    <button class="btn pri block">${setup?t('create'):t('open')}</button>`;
  $('#lkForgot').hidden=setup;$('#lkForgot').textContent=t('forgot');
  $('#lock').hidden=false;
  setTimeout(()=>{const i=$('#lp1');if(i)i.focus()},80);
  $('#lkF').onsubmit=async e=>{e.preventDefault();const err=m=>$('#lkE').textContent=m;
    const p1=$('#lp1').value;
    if(setup){const p2=$('#lp2').value;if(p1.length<6){err(t('pinShort'));return}if(p1!==p2){err(t('pinMismatch'));return}
      err(t('working'));SALT=crypto.getRandomValues(new Uint8Array(16));KEYOBJ=await derive(p1,SALT,ITER);
      let legacy=null;try{const r=localStorage.getItem(KEY);if(r)legacy=JSON.parse(r)}catch(x){}
      S=legacy&&legacy.v?Object.assign(blank(),legacy):seed();S.lang=S.lang||LANG;
      save();await saving;try{localStorage.removeItem(KEY)}catch(x){}
      unlocked();return}
    if(Date.now()<blockedUntil){err(t('waitTry'));return}
    err(t('working'));
    try{const k=await derive(p1,fromB64(vt.salt),vt.iter||ITER);const o=await unseal(k,vt.iv,vt.ct);KEYOBJ=k;SALT=fromB64(vt.salt);S=Object.assign(blank(),o);fails=0;unlocked()}
    catch(x){fails++;$('#lp1').value='';if(fails>=5){blockedUntil=Date.now()+30000;fails=0;err(t('waitTry'))}else err(t('wrongPin'))}
  };
}
function unlocked(){$('#lock').hidden=true;$('#lkF').innerHTML='';LANG=S.lang;migrate();render();runRecurring();maybeUpdateRates();loadRT().then(()=>{if(drv.linked&&useWorker()&&!RT&&S){drv.needAuth=true;render()}})}
function lockNow(){clearTimeout(bkTimer);closeSheet();S=null;KEYOBJ=null;SALT=null;RT=null;$('#view').innerHTML='';showLock()}
$('#lkForgot').onclick=()=>{
  $('#lkT').textContent=t('forgotConfirm');$('#lkH').textContent='';$('#lkE').textContent='';$('#lkForgot').hidden=true;
  $('#lkF').innerHTML=`<div class="foot"><button type="button" class="btn grow" id="fNo">${t('cancel')}</button><button type="button" class="btn grow" id="fYes" style="background:var(--neg);border-color:var(--neg);color:#fff">${t('del')}</button></div>`;
  $('#fNo').onclick=showLock;
  $('#fYes').onclick=()=>{try{localStorage.removeItem(VAULT);localStorage.removeItem(KEY);localStorage.removeItem('daftari-rt');localStorage.removeItem('daftari-gtoken')}catch(e){}showLock()};
};
$('#lockBtn').onclick=()=>{if(S)lockNow()};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now()}
  else if(S&&hiddenAt&&Date.now()-hiddenAt>60000){lockNow()}
});

if(!(window.crypto&&crypto.subtle)){$('#lkT').textContent='This browser cannot encrypt data. Open the app over https.';}
else showLock();
})();
