<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6A50">
<meta name="description" content="Daftari (دفتري) — متابعة المصروفات والإيرادات والأقساط والجمعيات والسلف">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتري Daftari">
<title>دفتري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600&display=swap">
<style>
/* Layout: single-column phone ledger, sticky month header, bottom tab bar, sheets slide up from the bottom */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E6EAE3; --ink:#17201C; --muted:#5B6962; --line:#D3DAD1;
  --accent:#1D6A50; --accent-ink:#FFFFFF; --accent-soft:#DBEAE2;
  --pos:#1F7A4A; --neg:#B2452D; --neg-soft:#F5E0D9; --warn:#9A6210; --warn-soft:#F5E7CC;
  --scrim:rgba(15,22,19,.45);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#212B27; --ink:#E6EEE9; --muted:#9AABA2; --line:#2C3833;
  --accent:#5FBF98; --accent-ink:#0B1712; --accent-soft:#1C3229;
  --pos:#62C890; --neg:#EF8A70; --neg-soft:#3A221B; --warn:#E3B05A; --warn-soft:#382C15;
  --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#212B27; --ink:#E6EEE9; --muted:#9AABA2; --line:#2C3833;
  --accent:#5FBF98; --accent-ink:#0B1712; --accent-soft:#1C3229;
  --pos:#62C890; --neg:#EF8A70; --neg-soft:#3A221B; --warn:#E3B05A; --warn-soft:#382C15;
  --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em;cursor:pointer;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand::after{content:' ▾';font-size:12px;color:var(--muted)}
.top.shared{background:var(--accent-soft)}
.top.shared .brand{color:var(--accent)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month span,.perbtn{min-width:118px;text-align:center;font-weight:500;font-size:14px}
.perbtn{border:0;background:none;cursor:pointer;padding:4px 2px;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.perbtn:hover{color:var(--accent)}
.iconbtn{width:34px;height:34px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
[dir="ltr"] .flip{transform:scaleX(-1)}

main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:24px;padding-block:18px}

/* summary slip */
.slip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip .net{padding:16px 18px 14px;display:flex;flex-direction:column;gap:2px}
.label{font-size:12.5px;color:var(--muted);letter-spacing:.01em;font-weight:500}
.big{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.15}
.big small{font-size:15px;font-weight:400;color:var(--muted);margin-inline-start:6px}
.perf{height:0;border-top:2px dashed var(--line);margin:0 12px}
.slip .split{display:grid;grid-template-columns:1fr 1fr}
.slip .split > div{padding:12px 18px;display:flex;flex-direction:column;gap:2px}
.slip .split > div + div{border-inline-start:1px solid var(--line)}
.mid{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-family:var(--f-display);font-size:17.5px;font-weight:600;letter-spacing:-.01em}
.link{border:0;background:none;color:var(--accent);font-weight:500;cursor:pointer;padding:4px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;min-width:0}
.row + .row{border-top:1px solid var(--line)}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .amt{font-family:var(--f-display);font-weight:600;font-size:15.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.glyph{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;background:var(--sunk);color:var(--muted)}
.glyph.in{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.daylbl{font-size:12px;color:var(--muted);padding:10px 14px 4px;background:var(--bg)}

.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.danger{color:var(--neg);border-color:var(--neg-soft)}
.btn.block{width:100%;padding:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* obligation cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{margin:0;font-size:16px;font-weight:600;font-family:var(--f-display)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.neg{background:var(--neg)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* reports */
.catbar{display:flex;flex-direction:column;gap:7px;padding:12px 14px}
.catbar + .catbar{border-top:1px solid var(--line)}
.catbar .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.catbar .l>span:last-child{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct{font-family:var(--f-body);font-size:11.5px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 7px;margin-inline-start:6px}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:150px;padding:14px 14px 0}
.cols .c{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.cols .c i{display:block;width:40%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.cols .c i.a{background:var(--accent)} .cols .c i.b{background:var(--neg)}
.colsx{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 14px 12px;font-size:11.5px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:0 14px 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}

/* nav + fab */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent);font-weight:600}
.nav svg{width:22px;height:22px}
.fab{position:fixed;z-index:21;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(18px,calc((100vw - 560px)/2 + 18px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(20,60,45,.28)}
.fab svg{width:26px;height:26px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 8px}
.shh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:sticky;top:-6px;background:var(--surface);z-index:2;padding-top:4px}
.panel h3{margin:0 0 14px;font-family:var(--f-display);font-size:18px;font-weight:600}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > span{font-size:13px;color:var(--muted);font-weight:500}
.in-f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-width:0}
.in-f.amt{font-family:var(--f-display);font-size:22px;font-weight:600}
textarea.in-f{min-height:90px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.foot{display:flex;gap:8px;margin-top:4px}
.foot .grow{flex:1}

.toast{max-width:min(92vw,520px);text-align:center;line-height:1.6;cursor:pointer;position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;font-size:14px}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.setrow + .setrow{border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:13.5px}
[dir="rtl"] .chip{padding:3px 10px 3px 6px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:99px}
.chip button:hover{background:var(--neg-soft);color:var(--neg)}
.search{display:flex;gap:8px}
.cur{font-size:.72em;font-weight:500;color:var(--muted)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.stmt{width:100%;border-collapse:collapse;font-size:13px}
.stmt th{font-weight:600;color:var(--muted);text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.stmt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.stmt td.n{white-space:nowrap;text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
.stmt td.d{white-space:nowrap;color:var(--muted)}
.stmt tr.tap{cursor:pointer}.stmt tr.tap:hover td{background:var(--sunk)}
.stmt tr.open td{color:var(--muted);font-style:italic}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sumgrid div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
details.box>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary h2{margin:0;font-family:var(--f-display);font-size:17.5px;font-weight:600;letter-spacing:-.01em}
.sumv{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.sumv small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.75em}
details.box>summary h2::before{content:"▸";display:inline-block;margin-inline-end:6px;color:var(--muted);transition:transform .15s}
[dir="rtl"] details.box>summary h2::before{transform:scaleX(-1)}
details.box[open]>summary h2::before{transform:rotate(90deg)}
details.box{display:flex;flex-direction:column;gap:8px}
details.box>.list{margin-top:8px}
.grp{font-size:13px;font-weight:600;color:var(--ink);background:var(--sunk);padding:8px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp .num{font-family:var(--f-display)}
.grp+.row{border-top:0}
.tile{cursor:pointer}.tile:hover{background:var(--sunk)}
.sub{padding-inline-start:30px}
.row.sub .t{font-size:14px;color:var(--muted)}
.balchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.balchip{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-family:var(--f-display);font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.balchip:hover{border-color:var(--accent)}
.balchip.add{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--accent);border-style:dashed}
.totbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.totbar>div{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.totbar>div+div{border-inline-start:1px solid var(--line)}
.totbar b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbox{position:relative;flex:1;min-width:0}
.qbox .in-f{padding-inline-end:40px}
.qx{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:999px;color:var(--muted);cursor:pointer;font-size:18px}
.qx:hover{background:var(--sunk);color:var(--ink)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .seg{grid-column:1/-1}
.qadd{display:flex;gap:8px}.qadd .btn{padding:8px 14px;font-size:16px}
.qchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:-12px}.qchips .balchip{white-space:nowrap;font-family:var(--f-body);font-weight:600;font-size:13.5px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.cwd,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwd span{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.cday{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:9px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;cursor:pointer;overflow:hidden;color:var(--ink);min-width:0}
.cday::before{content:"";position:absolute;inset:auto 0 0 0;height:calc(var(--h)*100%);background:var(--neg-soft);z-index:0}
.cday>*{position:relative;z-index:1}.cday .dn{font-size:12px;font-weight:600}.cday .dv{font-size:10px;font-weight:600;color:var(--neg);font-variant-numeric:tabular-nums}
.cday.today{border-color:var(--accent);border-width:2px}.cday.on{outline:2px solid var(--accent);outline-offset:1px}
.din,.ddue{position:absolute;top:4px;width:6px;height:6px;border-radius:9px}.din{inset-inline-start:4px;background:var(--accent)}.ddue{inset-inline-end:4px;background:var(--warn)}
.card .hd.tap{cursor:pointer}
#txf,#obf{flex-wrap:wrap}

/* lock screen */
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lockmark{width:64px;height:64px;margin:0 auto;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lockmark svg{width:30px;height:30px}
.lockbox .brand{font-size:24px;max-width:none;cursor:default}
.lockbox .brand::after{content:none}
.lockbox h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.pin{font-family:var(--f-display);font-size:24px;letter-spacing:.3em;text-align:center}
.err{color:var(--neg);font-size:14px;min-height:21px;margin:0}
.lockbox .form{text-align:start}
.acct{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.acct .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;text-align:start}

function seed(){
  const s=blank(); s.sample=true;
  const d=(ym,day)=>ym+'-'+pad(day);
  const add=(type,cat,amount,date,note)=>s.tx.push({id:uid(),type,cat,amount,date,note:note||''});

    const ym=ymAdd(TODAY_YM,i), last=i===0?Math.max(1,now.getDate()):28;
    const dd=n=>d(ym,Math.min(n,last));

    if(i%2===0) add('income','side',3500,dd(12),'شغل فريلانس');
    add('expense','food',1850+((i+5)*137)%600,dd(3),'هايبر');

const VAULT='daftar-elbeit-vault', ITER=310000;
const te=new TextEncoder(), td=new TextDecoder();
const toB64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pin,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{iv:toB64(iv),ct:toB64(ct)}}
async function unseal(key,iv,ct){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(iv)},key,fromB64(ct));return JSON.parse(td.decode(pt))}

const FREQS=['weekly','monthly','quarterly','yearly'];
function advance(date,freq,day){
  const d=dOf(date);
  if(freq==='weekly')return iso(new Date(d.getTime()+7*864e5));
  let y=d.getUTCFullYear(),m=d.getUTCMonth()+(freq==='monthly'?1:freq==='quarterly'?3:12);y+=Math.floor(m/12);m=m%12;
  const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return iso(new Date(Date.UTC(y,m,Math.min(day||d.getUTCDate(),last))));
}
function runRecurring(){

  for(const r of S.recur){let guard=0;
    while(r.next<=TODAY&&guard++<500){

      const rid='R'+r.id+'_'+r.next;if(!S.tx.some(x=>x.id===rid)){S.tx.push(Object.assign({},r.tpl,{id:rid,date:r.next,rec:r.id}));n++}

}

const AR_DIG='٠١٢٣٤٥٦٧٨٩',FA_DIG='۰۱۲۳۴۵۶۷۸۹';
const normDigits=x=>String(x||'').replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d)).replace(/[۰-۹]/g,d=>FA_DIG.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
const KW_CAT=[[/بنزين|وقود|سولار|غاز طبيعي|fuel|petrol|gas station|اوبر|أوبر|uber|careem|كريم|تاكسي|مواصلات|مترو|ميكروباص/i,'transport'],
  [/عيش|خضار|فاكهة|فاكهه|سوبر ?ماركت|هايبر|بقالة|بقاله|كارفور|carrefour|سبينيس|spinneys|مطعم|اكل|أكل|طلبات|talabat|ماكدونالدز|كافيه|قهوة|grocer|restaurant|food/i,'food'],
  [/كهربا|كهرباء|مياه|ميه|غاز|فاتورة|فاتوره|انترنت|إنترنت|نت|باقة|باقه|we |اتصالات|اورنج|أورانج|فودافون فاتورة|bill|electric|water/i,'bills'],
  [/دكتور|طبيب|صيدلية|صيدليه|دوا|دواء|علاج|مستشفى|تحاليل|pharmacy|doctor|hospital/i,'health'],
  [/مدرسة|مدرسه|دروس|درس|كورس|جامعة|مصاريف دراسية|school|course|tuition/i,'edu'],[/لبس|هدوم|جزمة|جزمه|كوتشي|clothes|shoes/i,'clothes'],
  [/ايجار|إيجار|rent/i,'rent'],[/هدية|هديه|عيدية|عيديه|فرح|gift/i,'gifts'],[/صدقة|صدقه|زكاة|زكاه|تبرع|charity|zakat/i,'charity'],[/صيانة|صيانه|سباك|كهربائي|نقاش|repair/i,'house'],
  [/مرتب|راتب|salary|payroll/i,'salary'],[/حافز|مكافأة|مكافاة|بونص|bonus/i,'bonus'],[/فوايد|فوائد|عائد|interest/i,'interest']];
const KW_IN=/قبضت|استلمت|جالي|جالى|اتحول لي|اتحولي|حولولي|إيداع|ايداع|اضافة|إضافة|دائن|credited|received|deposit|refund|استرداد|مرتجع|تم استلام|incoming/i;
const KW_OUT=/صرفت|دفعت|اشتريت|خصم|سحب|شراء|مدين|debited|purchase|paid|withdraw|spent|تم دفع|سداد|charged/i;
function parseEntry(text){
  const raw=normDigits(text).replace(/\s+/g,' ').trim();if(!raw)return null;
  /* amounts, skipping ones labelled as the remaining balance */
  const re=/(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?/g;let m,amount=0;
  while((m=re.exec(raw))){const before=raw.slice(Math.max(0,m.index-18),m.index);if(/رصيد|balance|available|المتاح|متاح/i.test(before))continue;
    const v=parseFloat(m[1].replace(/,/g,'')+(m[2]?'.'+m[2]:''));if(v>0&&!(m[1].length>=8&&!m[1].includes(','))){amount=v;break}}
  const type=KW_IN.test(raw)&&!/صرفت|دفعت|اشتريت/.test(raw)?'income':'expense';
  const low=raw.toLowerCase();
  let acc=null;S.accounts.slice().sort((a,b)=>b.name.length-a.name.length).forEach(a=>{if(!acc&&a.name&&low.includes(a.name.toLowerCase()))acc=a});
  if(!acc&&/فودافون كاش|vodafone cash/i.test(raw))acc=S.accounts.find(a=>/فودافون|vodafone/i.test(a.name));
  if(!acc&&/كاش|cash|نقدي/i.test(raw))acc=S.accounts.find(a=>a.type==='cash');
  let cat=null;const cands=S.cats[type].slice().sort((a,b)=>cName(b).length-cName(a).length);
  for(const c of cands){const n=[c.ar,c.en].filter(Boolean);if(n.some(w=>w.length>2&&low.includes(w.toLowerCase()))){cat=c.id;break}}
  if(!cat)for(const [rx,id] of KW_CAT){if(rx.test(raw)&&S.cats[type].some(c=>c.id===id)){cat=id;break}}
  /* prefer a sub-category whose name appears */
  if(cat)for(const k of catKids(type,cat))if(low.includes(cName(k).toLowerCase())){cat=k.id;break}

  const liquid=S.accounts.filter(a=>['cash','bank','wallet'].includes(a.type)).reduce((v,a)=>v+toBase(accBalance(a),a.currency),0);
  const end=TODAY_YM+'-31';

  let recOut=0,recIn=0;
  S.recur.forEach(r=>{let d=r.next,g=0;const a=accOf(r.tpl.acc);if(!a)return;while(d<=end&&g++<40){if(!r.end||d<=r.end){const v=toBase(r.tpl.amount,a.currency);if(r.tpl.type==='expense')recOut+=v;else if(r.tpl.type==='income')recIn+=v}d=advance(d,r.freq,r.day)}});

/* ---------- obligations logic ---------- */
const instMonths=it=>Array.from({length:it.count},(_,i)=>ymAdd(it.start,i));
const instNext=it=>instMonths(it).find(m=>!it.paid.includes(m))||null;
const gamMonths=g=>Array.from({length:g.members},(_,i)=>ymAdd(g.start,i));
const gamNext=g=>gamMonths(g).find(m=>!g.paid.includes(m))||null;
const gamPayout=g=>ymAdd(g.start,g.myTurn-1);

const oblPer=(k,o)=>k==='inst'?+o.monthly:+o.share;
const oblMonths=(k,o)=>k==='inst'?instMonths(o):gamMonths(o);
const partOf=(o,m)=>+((o.part||{})[m]||0);
const paidAmt=(k,o)=>o.paid.length*oblPer(k,o)+Object.entries(o.part||{}).filter(([m])=>!o.paid.includes(m)).reduce((v,[,a])=>v+(+a||0),0);
const oblLeft=(k,o)=>oblPer(k,o)*oblMonths(k,o).length-paidAmt(k,o);
/* what is still owed for months up to ym */
function owedUpTo(k,o,ym){return oblMonths(k,o).filter(m=>m<=ym&&!o.paid.includes(m)).reduce((v,m)=>v+oblPer(k,o)-partOf(o,m),0)}
function dueFor(ym){
  const out=[];
  [['inst',S.inst],['gam',S.gam]].forEach(([k,list])=>list.forEach(o=>{
    const un=oblMonths(k,o).filter(m=>m<=ym&&!o.paid.includes(m));
    if(un.length)out.push({k,id:o.id,name:o.name,cur:o.currency,amount:owedUpTo(k,o,ym),late:un.filter(m=>m<ym).length,ym:un[0],partial:un.some(m=>partOf(o,m)>0)});
    if(k==='gam'&&!o.received&&gamPayout(o)<=ym)out.push({k:'gamr',id:o.id,name:o.name,cur:o.currency,amount:o.share*o.members,late:0,ym:gamPayout(o)});
  }));
  return out;
}
/* spread a payment over the oldest unpaid months */
function allocate(k,o,amt){
  const per=oblPer(k,o),alloc={};o.part=o.part||{};
  for(const m of oblMonths(k,o)){
    if(amt<=0.004)break;if(o.paid.includes(m))continue;
    const take=Math.min(per-partOf(o,m),amt);if(take<=0)continue;
    alloc[m]=Math.round(take*100)/100;o.part[m]=partOf(o,m)+take;amt-=take;
    if(o.part[m]>=per-0.004){o.paid.push(m);delete o.part[m]}
  }
  return alloc;
}

  if(!accs.length){toast(t('needAccCur')+' '+cc);return}

  const def=recv?left:Math.round((owedUpTo(k,o,cur>TODAY_YM?cur:TODAY_YM)||Math.min(oblPer(k,o)-partOf(o,oblMonths(k,o).find(m=>!o.paid.includes(m))||''),left))*100)/100;
  const pa=payAcc(cc)||accs[0].id;
  openSheet((recv?t('collectPay'):t('pay'))+' · '+o.name,`<form class="form" id="f">
    ${recv?'':`<div class="sumgrid"><div><span class="label">${t('dueNow')}</span><b class="num">${fmt(def)} <small class="cur">${esc(curSym(cc))}</small></b></div><div><span class="label">${t('remainingAll')}</span><b class="num">${fmt(left)} <small class="cur">${esc(curSym(cc))}</small></b></div></div>`}
    <label class="fld"><span>${t('amountPaid')} (${esc(curName(cc))})</span><input class="in-f amt num" id="amt" inputmode="decimal" value="${def}"></label>
    <label class="fld"><span>${recv?t('toAcc'):t('fromAcc')}</span><select class="in-f" id="acc">${accs.map(a=>`<option value="${a.id}" ${a.id===pa?'selected':''}>${esc(a.name)} · ${a.currency}</option>`).join('')}</select></label>
    <label class="fld"><span>${t('date')}</span><input class="in-f" type="date" id="dt" value="${TODAY}"></label>
    ${recv?'':`<p class="hint">${t('partialHint')}</p>`}
    <div class="foot"><button class="btn pri grow">${t('save')}</button></div></form>`,r=>{
    setTimeout(()=>r.querySelector('#amt').select(),60);
    r.querySelector('#f').onsubmit=e=>{e.preventDefault();let a=numv(r,'amt');if(a<=0){toast(t('needAmt'));return}
      const acc=val(r,'acc'),date=val(r,'dt')||TODAY;
      if(recv){o.received=true;S.tx.push({id:uid(),acc,type:'income',cat:'gamin',amount:a,date,note:o.name,link:{k:'gamr',id}})}
      else{if(a>left+0.004){toast(t('overLeft')+' '+fmt(left));return}
        const alloc=allocate(k,o,a),ms=Object.keys(alloc);
        S.tx.push({id:uid(),acc,type:'expense',cat:k,amount:a,date,note:o.name+' · '+ms.map(monthShort).join('، ')+(ms.length===1&&alloc[ms[0]]<oblPer(k,o)-0.004?' ('+t('partial')+')':''),link:{k,id,alloc}})}
      closeSheet();commit(t('saved'))};
  });

function payInst(id){payForm('inst',id)}
function payGam(id){payForm('gam',id)}
function recvGam(id){const g=S.gam.find(x=>x.id===id);if(!g||g.received)return;payForm('gam',id,true)}
function unlink(tx){if(!tx.link)return;const l=tx.link;
  if(l.k==='gamr'){const g=S.gam.find(x=>x.id===l.id);if(g)g.received=false;return}
  const o=(l.k==='inst'?S.inst:S.gam).find(x=>x.id===l.id);if(!o)return;
  const per=oblPer(l.k,o),alloc=l.alloc||(l.ym?{[l.ym]:per}:{});o.part=o.part||{};
  for(const [m,v] of Object.entries(alloc)){
    let have=o.paid.includes(m)?per:partOf(o,m);o.paid=o.paid.filter(x=>x!==m);
    have=Math.round((have-v)*100)/100;if(have>0.004)o.part[m]=have;else delete o.part[m];
  }
}
function delTx(id){const tx=S.tx.find(x=>x.id===id);if(!tx)return;unlink(tx);if(tx.rcpt&&typeof gToken!=='undefined'&&hasToken())gfetch('/drive/v3/files/'+tx.rcpt,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})}).catch(()=>{});S.tx=S.tx.filter(x=>x.id!==id)}
function undoLast(kind,id){
  const o=(kind==='inst'?S.inst:S.gam).find(x=>x.id===id);if(!o)return;
  const linked=S.tx.filter(x=>x.link&&x.link.k===kind&&x.link.id===id).sort((a,b)=>a.date.localeCompare(b.date));
  if(linked.length)delTx(linked[linked.length-1].id);
  else if(o.paid.length){const sorted=[...o.paid].sort();o.paid=o.paid.filter(m=>m!==sorted[sorted.length-1])}
  commit(t('deleted'));
}

function commit(msg){save();render();if(msg)toast(msg)}
let tt;function toast(m,ms){const el=$('#toast');el.textContent=m;el.hidden=false;el.onclick=()=>{el.hidden=true};clearTimeout(tt);if(ms===0)return;tt=setTimeout(()=>el.hidden=true,ms||Math.max(3500,String(m).length*90))}
const toastOff=m=>{const el=$('#toast');if(!m||el.textContent===m)el.hidden=true};

/* ---------- sheet ---------- */
function openSheet(title,html,ready){$('#shT').textContent=title;$('#shB').innerHTML=html;$('#sheet').hidden=false;if(ready)ready($('#shB'))}
function closeSheet(){$('#sheet').hidden=true;$('#shB').innerHTML=''}
$('#scrim').onclick=closeSheet;$('#shX').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function confirmSheet(msg,yesLbl,onYes){
  openSheet(msg,`<div class="foot"><button class="btn grow" id="cNo">${t('cancel')}</button><button class="btn pri grow" id="cYes" style="background:var(--neg);border-color:var(--neg)">${esc(yesLbl||t('yes'))}</button></div>`,b=>{
    b.querySelector('#cNo').onclick=closeSheet;b.querySelector('#cYes').onclick=()=>{closeSheet();onYes()}})}
const segHTML=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===val?'on':''}">${esc(l)}</button>`).join('')}</div>`;
function bindSeg(root,id,cb){root.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{root.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v)})}
const val=(r,id)=>r.querySelector('#'+id).value.trim();
const numv=(r,id)=>parseFloat(val(r,id).replace(/,/g,''))||0;

    <label class="fld"><span>${t('amount')} (<b id="amtC"></b>)</span><input class="in-f amt num" id="amt" inputmode="decimal" autocomplete="off" value="${tx.amount}" placeholder="0"></label>
    <label class="fld" id="toAmtW" hidden><span>${t('received')} (<b id="toC"></b>)</span><input class="in-f amt num" id="toAmt" inputmode="decimal" autocomplete="off" value="${tx.toAmount??''}" placeholder="0"></label>
    <label class="fld" id="catW" ${type==='transfer'?'hidden':''}><span>${t('category')}</span><select class="in-f" id="cat">${type==='transfer'?'':catOpts(type)}</select></label>

    <label class="fld"><span>${t('note')}</span><input class="in-f" id="nt" value="${esc(tx.note)}" autocomplete="off"></label>
    ${ACT!=='me'&&ledgerMembers().length>1?`<div class="two" id="spW"><label class="fld"><span>${t('paidByL')}</span><select class="in-f" id="pb">${ledgerMembers().map(m=>`<option value="${esc(m)}" ${(tx.paidBy||tx.by||myEmail())===m?'selected':''}>${esc(shortName(m))}</option>`).join('')}</select></label>
      <label class="fld"><span>${t('splitL')}</span><select class="in-f" id="spl"><option value="">${t('splitAll')}</option><option value="self" ${tx.split==='self'?'selected':''}>${t('splitSelf')}</option></select></label></div>`:''}
    <label class="fld"><span>${t('tags')}</span><input class="in-f" id="tg" list="dl-tags" value="${esc((tx.tags||[]).join('، '))}" placeholder="${t('tagsHint')}" autocomplete="off">${datalist('dl-tags',allTags())}</label>
    <label class="fld"><span>${t('receipt')}</span><input class="in-f" type="file" accept="image/*" id="rf"></label>
    ${isNew?`<label class="chk"><input type="checkbox" id="qk"> ${t('saveQuick')}</label>`:''}
    ${tx.rcpt?`<button type="button" class="btn block" data-sact="rcpt" data-id="${tx.id}">🧾 ${t('showReceipt')}</button>`:''}
    ${tx.rec&&S.recur.some(v=>v.id===tx.rec)?`<button type="button" class="btn block" data-sact="rec" data-id="${tx.rec}">↻ ${t('recurring')}: ${freqName(S.recur.find(v=>v.id===tx.rec).freq)}</button>`:
      `<label class="fld"><span>${t('repeat')}</span><select class="in-f" id="rp"><option value="">${t('noRepeat')}</option>${FREQS.map(f=>`<option value="${f}" ${f===tx.repeat?'selected':''}>${freqName(f)}</option>`).join('')}</select></label>`}
    <div class="foot">${isNew?'':`<button type="button" class="btn danger" id="del">${t('del')}</button>`}<button class="btn pri grow">${t('save')}</button></div>
  </form>`,r=>{
    const $r=q=>r.querySelector(q);let toTouched=!isNew&&tx.toAmount!=null;
    const sync=()=>{
      const fa=accOf($r('#acc').value),ta=accOf($r('#to').value),diff=type==='transfer'&&fa.currency!==ta.currency;
      $r('#amtC').textContent=curName(fa.currency);$r('#toC').textContent=curName(ta.currency);
      $r('#toAmtW').hidden=!diff;
      if(diff&&!toTouched){const a=parseFloat($r('#amt').value)||0,ra=rateOf(fa.currency),rb=rateOf(ta.currency);$r('#toAmt').value=a&&ra&&rb?Math.round(a*ra/rb*100)/100:''}
    };
    bindSeg(r,'ty',v=>{type=v;$r('#toW').hidden=v!=='transfer';$r('#catW').hidden=v==='transfer';$r('#accL').textContent=v==='transfer'?t('fromAcc'):t('account');if(v!=='transfer')$r('#cat').innerHTML=catOpts(v);sync()});
    $r('#acc').onchange=sync;$r('#to').onchange=sync;$r('#amt').oninput=sync;$r('#toAmt').oninput=()=>{toTouched=true};
    sync();
    if(isNew)setTimeout(()=>$r('#amt').focus(),50);
    if(!isNew)$r('#del').onclick=()=>confirmSheet(t('confirmDel'),t('del'),()=>{delTx(tx.id);commit(t('deleted'))});
    $r('#f').onsubmit=e=>{e.preventDefault();const a=numv(r,'amt');if(a<=0){toast(t('needAmt'));return}
      let o={type,acc:val(r,'acc'),amount:a,date:val(r,'dt')||TODAY,note:val(r,'nt'),tags:parseTags(val(r,'tg'))};if(!o.tags.length)delete o.tags;
      if($r('#pb')){o.paidBy=$r('#pb').value;o.split=$r('#spl').value||undefined}
      if(type==='transfer'){
        const to=val(r,'to');if(to===o.acc){toast(t('sameAcc'));return}
        const diff=accOf(o.acc).currency!==accOf(to).currency,ta=diff?numv(r,'toAmt'):a;
        if(diff&&ta<=0){toast(t('needAmt'));return}
        Object.assign(o,{toAcc:to,toAmount:ta,cat:'transfer'});
      }else Object.assign(o,{cat:val(r,'cat'),toAcc:undefined,toAmount:undefined});
      const rp=$r('#rp')?$r('#rp').value:'';let saved;
      if(isNew){saved=Object.assign({id:uid()},o);S.tx.push(saved)}else{saved=S.tx.find(x=>x.id===tx.id);Object.assign(saved,o);if(!o.tags)delete saved.tags;if(type!=='transfer'){delete saved.toAcc;delete saved.toAmount}}
      if(isNew&&$r('#qk')&&$r('#qk').checked){const q=Object.assign({},saved);delete q.id;delete q.date;delete q.rec;delete q.rcpt;delete q.link;S.quick.push(Object.assign({id:'q'+uid()},q))}
      if(rp&&!saved.rec){const rid='r'+uid(),tpl=Object.assign({},saved);delete tpl.id;delete tpl.date;delete tpl.rec;delete tpl.link;
        S.recur.push({id:rid,freq:rp,day:+saved.date.slice(8,10),next:advance(saved.date,rp),tpl});saved.rec=rid}
      else if(saved.rec){const rr=S.recur.find(v=>v.id===saved.rec);if(rr){const tpl=Object.assign({},saved);delete tpl.id;delete tpl.date;delete tpl.rec;delete tpl.link;rr.tpl=tpl}}
      S.defAcc=o.acc;const rf=$r('#rf').files[0];closeSheet();commit(t('saved'));if(rp)runRecurring();if(rf)uploadReceipt(saved,rf)};
  });
}

function accBalanceAt(a,date){let b=+a.opening||0;for(const x of S.tx){if(x.date>date)continue;

function netWorth(date){
  date=date||TODAY;let assets=0,neg=0;
  S.accounts.forEach(a=>{const v=toBase(accBalanceAt(a,date),a.currency);if(v>=0)assets+=v;else neg+=v});
  const recv=S.loans.filter(l=>l.dir==='lent').reduce((v,l)=>v+toBase(loanLeftAt(l,date),l.currency||BASE()),0);
  const pay=S.loans.filter(l=>l.dir==='borrowed').reduce((v,l)=>v+toBase(loanLeftAt(l,date),l.currency||BASE()),0);

  return {assets,neg,recv,pay,obl,net:assets+neg+recv-pay-obl};
}

const fileStamp=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+'-'+pad(d.getMinutes())+'-'+pad(d.getSeconds())};
const backupName=()=>'daftari_'+fileStamp()+'.json';
function lastBackupLbl(){let v=null;try{v=localStorage.getItem('daftar-elbeit-lastbackup')}catch(e){}
  if(!v)return t('never');return dateOf(new Date(v))+' '+hmOf(new Date(v))}
function markBackup(){try{localStorage.setItem('daftar-elbeit-lastbackup',new Date().toISOString())}catch(e){}}
async function makeBackup(){
  await saving;const {iv,ct}=await seal(KEYOBJ,PS||S);
  return JSON.stringify({app:'daftar-elbeit',enc:1,v:2,created:new Date().toISOString(),salt:toB64(SALT),iter:ITER,iv,ct});
}
async function getDownloads(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
async function saveToPhone(quiet){
  if(!KEYOBJ)return false;const data=await makeBackup(),fn=backupName();
  const dw=await getDownloads();
  if(dw){try{await dw.save({filename:fn,data});markBackup();if(!quiet)toast(t('saved'));return true}catch(e){return false}}
  if(window.claude){if(!quiet)toast(t('dlUnavailable'));return false}
  try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);markBackup();return true}catch(e){return false}
}

async function rcptKey(){if(!S.rk)S.rk=toB64(crypto.getRandomValues(new Uint8Array(32)));return crypto.subtle.importKey('raw',fromB64(S.rk),'AES-GCM',false,['encrypt','decrypt'])}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',0.8));
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- shared ledgers (a Drive file, encrypted with the ledger's own key) ---------- */
const SH_COLS=['tx','accounts','inst','gam','loans','recur','goals','settles'],SETK=['base','rates','ratesAt','goldManual','zakat','rk','name','members'],LOCALK=['lang','defAcc','autoDl','sample'];
let ACT='me',PS=null,SHM=null,shadow={},shTimer=null,shPoll=null,shBusy=false,shDirty=false,pendingJoin=null;
const toB64u=b=>toB64(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fromB64u=x=>fromB64(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4));
const ledKeys=new Map();
async function ledKey(m){if(!ledKeys.has(m.key))ledKeys.set(m.key,await crypto.subtle.importKey('raw',fromB64u(m.key),'AES-GCM',false,['encrypt','decrypt']));return ledKeys.get(m.key)}
const colsOf=D=>[...SH_COLS.map(k=>[k,D[k]||[]]),['cx',(D.cats||{}).expense||[]],['ci',(D.cats||{}).income||[]]];
const strip=r=>{const o=Object.assign({},r);delete o.u;return JSON.stringify(o)};
const setOf=D=>{const o={};SETK.forEach(k=>o[k]=D[k]);return o};
function snapshot(D){const m={};colsOf(D).forEach(([k,a])=>{m[k]={};a.forEach(r=>m[k][r.id]=strip(r))});m._set=JSON.stringify(setOf(D));m._bud=JSON.stringify(D.budgets||{});return m}
/* mark what changed since the last snapshot: new/edited records get a time, removed ones a tombstone */
function stamp(D){
  const now=Date.now();D._del=D._del||{};
  colsOf(D).forEach(([k,arr])=>{const old=shadow[k]||{},ids=new Set();
    arr.forEach(r=>{ids.add(r.id);if(old[r.id]!==strip(r)){r.u=now;if(k==='tx'&&!r.by&&drv.email)r.by=drv.email}});
    Object.keys(old).forEach(id=>{if(!ids.has(id))D._del[id]=now})});
  if(JSON.stringify(setOf(D))!==shadow._set)D._su=now;
  if(JSON.stringify(D.budgets||{})!==shadow._bud)D._bu=now;
  shadow=snapshot(D);
}
/* newest version of each record wins; a deletion wins over older edits */
function mergeLedger(A,B){
  const R=Object.assign({},A),del=Object.assign({},A._del||{});
  Object.entries(B._del||{}).forEach(([id,ts])=>{if(!(del[id]>=ts))del[id]=ts});R._del=del;
  const pick=(la,lb)=>{const m=new Map();[...(la||[]),...(lb||[])].forEach(r=>{const c=m.get(r.id);if(!c||(r.u||0)>(c.u||0))m.set(r.id,r)});return [...m.values()].filter(r=>!(del[r.id]>=(r.u||0)))};
  SH_COLS.forEach(k=>R[k]=pick(A[k],B[k]));
  R.cats={expense:pick((A.cats||{}).expense,(B.cats||{}).expense),income:pick((A.cats||{}).income,(B.cats||{}).income)};
  if((B._su||0)>(A._su||0)){SETK.forEach(k=>R[k]=B[k]);R._su=B._su}
  if((B._bu||0)>(A._bu||0)){R.budgets=B.budgets;R._bu=B._bu}
  return R;
}
const stripLocal=D=>{const o=Object.assign({},D);LOCALK.forEach(k=>delete o[k]);return o};
function prepShared(D){D.lang=(PS&&PS.lang)||LANG;D.sample=false;D.cats=D.cats||mkCats();['tx','accounts','inst','gam','loans','recur','goals','settles'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});if(!D.budgets)D.budgets={};return D}
async function cacheSave(m,D){try{localStorage.setItem('daftari-led-'+m.id,JSON.stringify(await seal(KEYOBJ,D)))}catch(e){}}
async function cacheLoad(m){try{const o=JSON.parse(localStorage.getItem('daftari-led-'+m.id)||'null');return o?await unseal(KEYOBJ,o.iv,o.ct):null}catch(e){return null}}
async function shDownload(m){const j=await (await gfetch('/drive/v3/files/'+m.fileId+'?alt=media')).json();if(j.app!=='daftari-shared')throw new Error('bad');return await unseal(await ledKey(m),j.iv,j.ct)}

async function createLedger(name){

function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'',delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
function parseDateAny(v){
  if(v==null||v==='')return null;if(typeof v==='number'&&v>20000&&v<80000)return iso(new Date(Date.UTC(1899,11,30)+v*864e5));
  const x=normDigits(String(v)).trim();let m;
  if((m=x.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=x.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  const d=new Date(x);return isNaN(d)?null:iso(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())));
}
const numAny=v=>{if(typeof v==='number')return v;const x=normDigits(String(v||'')).replace(/[^\d.,\-()]/g,'').replace(/,/g,'');if(!x)return NaN;const neg=/^\(.*\)$/.test(x)||x.startsWith('-');return (neg?-1:1)*parseFloat(x.replace(/[()\-]/g,''))};

      try{if(/\.xlsx?$/i.test(f.name)){const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
        else rows=parseCSV(await f.text())}catch(e){toast(t('badFile'));return}
      const hi=Math.max(0,rows.findIndex(rw=>rw.filter(v=>typeof v==='string'&&v.trim()&&isNaN(numAny(v))).length>=2));
      const head=(rows[hi]||[]).map(v=>String(v).trim()),data=rows.slice(hi+1);
      const guess=rx=>head.findIndex(h=>rx.test(h));
      const cols={date:guess(/date|تاريخ/i),amount:guess(/amount|مبلغ|قيمة|قيمه|value/i),debit:guess(/debit|مدين|withdraw|سحب|out|مصروف/i),credit:guess(/credit|دائن|deposit|ايداع|إيداع|in$|إيراد|ايراد/i),
        cat:guess(/category|بند|تصنيف|نوع المصروف/i),acc:guess(/account|حساب|بنك|wallet/i),note:guess(/note|desc|بيان|ملاحظ|وصف|details|تفاصيل/i),type:guess(/^type$|^النوع$/i)};
      const sel=(k,label,opt)=>`<label class="fld"><span>${label}</span><select class="in-f" data-c="${k}"><option value="-1">${opt?t('noneCol'):'—'}</option>${head.map((h,i)=>`<option value="${i}" ${cols[k]===i?'selected':''}>${esc(h||('#'+(i+1)))}</option>`).join('')}</select></label>`;
      r.querySelector('#map').innerHTML=`<p class="hint">${data.length} ${t('rowsWord')}</p>
        <div class="two">${sel('date',t('date'))}${sel('amount',t('amount'),1)}</div>
        <div class="two">${sel('debit',t('dr')+' / '+t('exp1'),1)}${sel('credit',t('cr')+' / '+t('inc1'),1)}</div>
        <div class="two">${sel('cat',t('category'),1)}${sel('acc',t('account'),1)}</div>
        <div class="two">${sel('note',t('note'),1)}${sel('type',t('typeCol'),1)}</div>
        <div class="two"><label class="fld"><span>${t('defAccImp')}</span><select class="in-f" id="da">${accOpts(S.defAcc)}</select></label>
        <label class="fld"><span>${t('posIs')}</span><select class="in-f" id="ps"><option value="expense">${t('exp1')}</option><option value="income">${t('inc1')}</option></select></label></div>
        <label class="chk"><input type="checkbox" id="nc" checked> ${t('makeCats')}</label><label class="chk"><input type="checkbox" id="dp" checked> ${t('skipDup')}</label>
        <button type="button" class="btn pri block" id="go">${t('importNow')}</button>`;
      r.querySelector('#go').onclick=()=>{
        const c={};r.querySelectorAll('[data-c]').forEach(x=>c[x.dataset.c]=+x.value);if(c.date<0||(c.amount<0&&c.debit<0&&c.credit<0)){toast(t('needCols'));return}
        const posType=r.querySelector('#ps').value,defAcc=r.querySelector('#da').value,mk=r.querySelector('#nc').checked,dup=r.querySelector('#dp').checked;
        const seen=new Set(S.tx.map(x=>x.date+'|'+x.amount+'|'+(x.note||'')));let n=0,skipped=0;
        const findCat=(ty,name)=>{if(!name)return ty==='expense'?'other':'iother';const nm=String(name).trim(),low=nm.toLowerCase();let c2=S.cats[ty].find(k=>k.ar===nm||k.en.toLowerCase()===low);
          if(!c2&&mk){c2={id:'c'+uid(),ar:nm,en:nm,sys:false};S.cats[ty].splice(Math.max(0,S.cats[ty].findIndex(k=>k.sys)),0,c2)}return c2?c2.id:(ty==='expense'?'other':'iother')};
        const findAcc=name=>{if(!name)return defAcc;const low=String(name).trim().toLowerCase();const a=S.accounts.find(x=>x.name.toLowerCase()===low);return a?a.id:defAcc};
        data.forEach(rw=>{const date=parseDateAny(rw[c.date]);if(!date){skipped++;return}
          let amt=NaN,type=posType;
          if(c.debit>=0&&numAny(rw[c.debit])>0){amt=numAny(rw[c.debit]);type='expense'}else if(c.credit>=0&&numAny(rw[c.credit])>0){amt=numAny(rw[c.credit]);type='income'}
          else if(c.amount>=0){amt=numAny(rw[c.amount]);if(amt<0){type='expense';amt=-amt}}
          if(c.type>=0){const tv=String(rw[c.type]).toLowerCase();if(/income|ايراد|إيراد|دخل|دائن/.test(tv))type='income';else if(/expense|مصروف|مدين|صرف/.test(tv))type='expense'}
          if(!(amt>0)){skipped++;return}
          const note=c.note>=0?String(rw[c.note]||'').trim():'';const key=date+'|'+amt+'|'+note;if(dup&&seen.has(key)){skipped++;return}seen.add(key);
          S.tx.push({id:uid(),type,acc:c.acc>=0?findAcc(rw[c.acc]):defAcc,cat:findCat(type,c.cat>=0?rw[c.cat]:''),amount:Math.round(amt*100)/100,date,note});n++});
        closeSheet();commit(t('imported')+' '+n+(skipped?' · '+t('skippedN')+' '+skipped:''));
      };
    };
  });
}

/* ---------- who owes whom in a shared ledger ---------- */
const myEmail=()=>(REG&&REG.email)||drv.email||'';
const shortName=e=>String(e||'').split('@')[0];
function ledgerMembers(){const set=new Set([...(S.members||[]),...S.tx.map(x=>x.paidBy||x.by).filter(Boolean)]);if(myEmail())set.add(myEmail());return [...set]}
function splitBalances(){
  const mem=ledgerMembers(),bal={};mem.forEach(m=>bal[m]={paid:0,share:0,net:0});
  S.tx.filter(x=>x.type==='expense').forEach(x=>{const payer=x.paidBy||x.by;if(!payer||!bal[payer])return;const v=baseAmt(x);bal[payer].paid+=v;
    if(x.split==='self')bal[payer].share+=v;else mem.forEach(m=>bal[m].share+=v/mem.length)});
  (S.settles||[]).forEach(z=>{if(bal[z.from])bal[z.from].paid+=+z.amount;if(bal[z.to])bal[z.to].paid-=+z.amount});
  mem.forEach(m=>bal[m].net=bal[m].paid-bal[m].share);
  /* simplest set of payments to settle */
  const debt=mem.filter(m=>bal[m].net<-0.5).map(m=>({m,v:-bal[m].net})),cred=mem.filter(m=>bal[m].net>0.5).map(m=>({m,v:bal[m].net})),plan=[];
  let i=0,j=0;while(i<debt.length&&j<cred.length){const v=Math.min(debt[i].v,cred[j].v);plan.push({from:debt[i].m,to:cred[j].m,v});debt[i].v-=v;cred[j].v-=v;if(debt[i].v<0.5)i++;if(cred[j].v<0.5)j++}
  return {mem,bal,plan};
}
function splitHTML(){
  if(ACT==='me')return '';const {mem,bal,plan}=splitBalances();if(mem.length<2)return '';
  return `<details class="box" open><summary><h2>${t('splitTitle')}</h2></summary><div class="list">
    ${mem.map(m=>`<div class="row"><div class="glyph ${bal[m].net>0?'in':''}">${esc(initial(shortName(m)))}</div><div class="main"><span class="t">${esc(shortName(m))}${m===myEmail()?' ('+t('you')+')':''}</span><span class="s">${t('paidLbl')} ${fmt(bal[m].paid)} · ${t('shareOf')} ${fmt(bal[m].share)}</span></div><b class="amt ${bal[m].net<0?'neg':bal[m].net>0?'pos':''}">${bal[m].net>0?'+':''}${fmt(Math.round(bal[m].net))}</b></div>`).join('')}
    ${plan.map(p=>`<div class="row sub"><div class="main"><span class="t">${esc(shortName(p.from))} ← ${esc(shortName(p.to))}</span></div><b class="amt">${fmt(Math.round(p.v))}</b><button class="btn sm" data-act="settle" data-from="${esc(p.from)}" data-to="${esc(p.to)}" data-v="${Math.round(p.v)}">${t('settleBtn')}</button></div>`).join('')}
  </div><p class="hint">${t('splitHint')}</p></details>`;
}
function settleForm(from,to,v){
  const mem=ledgerMembers(),o=m=>mem.map(x=>`<option value="${esc(x)}" ${x===m?'selected':''}>${esc(shortName(x))}</option>`).join('');
  openSheet(t('settleBtn'),`<form class="form" id="f"><div class="two"><label class="fld"><span>${t('fromWho')}</span><select class="in-f" id="sf">${o(from)}</select></label><label class="fld"><span>${t('toWho')}</span><select class="in-f" id="st2">${o(to)}</select></label></div>
    <label class="fld"><span>${t('amount')} (${esc(curName(BASE()))})</span><input class="in-f amt num" id="amt" inputmode="decimal" value="${v||''}"></label><div class="foot"><button class="btn pri grow">${t('save')}</button></div></form>`,r=>{
    r.querySelector('#f').onsubmit=e=>{e.preventDefault();const a=numv(r,'amt');if(!a){toast(t('needAmt'));return}const f2=val(r,'sf'),t2=val(r,'st2');if(f2===t2){toast(t('sameAcc'));return}
      S.settles=S.settles||[];S.settles.push({id:'z'+uid(),from:f2,to:t2,amount:a,date:TODAY,by:myEmail()});closeSheet();commit(t('saved'))};
  });
}

/* ---------- fingerprint unlock (passkey + PRF): the PIN is kept encrypted by a key only the fingerprint can release ---------- */
const BIO_KEY='daftari-bio';
const bioInfo=()=>{try{return JSON.parse(localStorage.getItem(BIO_KEY)||'null')}catch(e){return null}};
const bioSupported=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function prfKey(bytes){const k=await crypto.subtle.importKey('raw',bytes,'HKDF',false,['deriveKey']);return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:te.encode('daftari-bio')},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bioPrf(credId,salt){
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:credId}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
  const r=a.getClientExtensionResults();if(!r.prf||!r.prf.results||!r.prf.results.first)throw new Error('noprf');return new Uint8Array(r.prf.results.first);
}
function bioEnableForm(){
  if(!bioSupported()){toast(t('bioUnsupported'));return}
  openSheet(t('bioOn'),`<form class="form" id="f"><p class="hint">${t('bioHint')}</p><label class="fld"><span>${t('curPin')}</span><input class="in-f pin" type="password" inputmode="numeric" id="p0" autocomplete="off"></label><p class="err" id="be"></p><div class="foot"><button class="btn pri grow">${t('bioSetup')}</button></div></form>`,r=>{
    const err=m=>r.querySelector('#be').textContent=m;setTimeout(()=>r.querySelector('#p0').focus(),60);
    r.querySelector('#f').onsubmit=async e=>{e.preventDefault();const pin=r.querySelector('#p0').value;
      try{err(t('working'));const vt=readVault();const k=await derive(pin,fromB64(vt.salt),vt.iter);await unseal(k,vt.iv,vt.ct)}catch(x){err(t('wrongPin'));return}
      try{
        const salt=crypto.getRandomValues(new Uint8Array(32));
        const cred=await navigator.credentials.create({publicKey:{rp:{name:'Daftari',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:myEmail()||'daftari',displayName:t('app')},
          challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
          authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
        const ext=cred.getClientExtensionResults();if(ext.prf&&ext.prf.enabled===false)throw new Error('noprf');
        const out=ext.prf&&ext.prf.results&&ext.prf.results.first?new Uint8Array(ext.prf.results.first):await bioPrf(cred.rawId,salt);
        const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await prfKey(out),te.encode(pin));
        localStorage.setItem(BIO_KEY,JSON.stringify({id:toB64(cred.rawId),salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)}));
        closeSheet();toast(t('bioDone'));render();
      }catch(x){err(x&&x.message==='noprf'?t('bioUnsupported'):t('bioFail'))}
    };
  });
}
async function bioUnlockPin(){const b=bioInfo();if(!b)throw new Error('none');const out=await bioPrf(fromB64(b.id),fromB64(b.salt));
  return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(b.iv)},await prfKey(out),fromB64(b.ct)))}
function bioOff(){try{localStorage.removeItem(BIO_KEY)}catch(e){}toast(t('bioOffMsg'));render()}

/* ---------- install (PWA) ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S&&tab==='set')render()});
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

/* ---------- lock ---------- */
let fails=0,blockedUntil=0,hiddenAt=0;
function showLock(){
  const vt=readVault(),setup=!vt,needReg=!!CFG.authWorker;
  const de=document.documentElement;de.lang=LANG;de.dir=LANG==='en'?'ltr':'rtl';
  $('#lkBrand').textContent=t('app');
  $('#lkT').textContent=setup?t('setupTitle'):t('lockTitle');
  $('#lkH').textContent=setup?t('pinMin'):'';
  $('#lkE').textContent='';
  $('#lkF').innerHTML=`${needReg?`<div id="acctW">${acctHTML()}</div>`:''}
    <input class="in-f pin" type="password" inputmode="numeric" autocomplete="off" id="lp1" aria-label="${t('pin1')}" placeholder="${t('pin1')}">
    ${setup?`<input class="in-f pin" type="password" inputmode="numeric" autocomplete="off" id="lp2" aria-label="${t('pin2')}" placeholder="${t('pin2')}">`:''}
    <button class="btn pri block">${setup?t('create'):t('open')}</button>
    ${!setup&&bioInfo()?`<button type="button" class="btn block" id="bioBtn">👆 ${t('bioUnlock')}</button>`:''}
    ${needReg?`<p class="hint" style="text-align:center;margin:0"><a href="privacy.html" target="_blank" rel="noopener" style="color:var(--muted)">${t('privacy')}</a></p>`:''}`;
  $('#lkForgot').hidden=setup;$('#lkForgot').textContent=t('forgot');
  $('#lock').hidden=false;
  const err=m=>$('#lkE').textContent=m;
  const bindG=()=>{const g=$('#gbtn');if(g)g.onclick=async()=>{if(!driveReady()){err(t('regLoading'));return}err(t('working'));
    try{await doRegister();$('#acctW').innerHTML=acctHTML();err('');$('#lp1').focus()}catch(x){err(t('regFail'))}}};
  bindG();
  const bb=$('#bioBtn');if(bb)bb.onclick=async()=>{try{const pin=await bioUnlockPin();$('#lp1').value=pin;$('#lkF').requestSubmit()}catch(x){err(t('bioFail'))}};
  if(!needReg||REG)setTimeout(()=>{const i=$('#lp1');if(i)i.focus()},80);
  $('#lkF').onsubmit=async e=>{e.preventDefault();
    const p1=$('#lp1').value;
    if(setup){const p2=$('#lp2').value;if(p1.length<6){err(t('pinShort'));return}if(p1!==p2){err(t('pinMismatch'));return}}
    else if(Date.now()<blockedUntil){err(t('waitTry'));return}
    /* sign in with Google first if this phone has not yet (skipped when offline) */
    if(needReg&&!REG&&navigator.onLine){
      if(!driveReady()){err(t('regLoading'));return}
      err(t('working'));try{await doRegister();$('#acctW').innerHTML=acctHTML()}catch(x){err(t('regFail'));return}
    }
    err(t('working'));
    if(setup){
      SALT=crypto.getRandomValues(new Uint8Array(16));KEYOBJ=await derive(p1,SALT,ITER);
      let legacy=null;try{const r=localStorage.getItem(KEY);if(r)legacy=JSON.parse(r)}catch(x){}
      S=legacy&&legacy.v?Object.assign(blank(),legacy):seed();S.lang=S.lang||LANG;
      save();await saving;try{localStorage.removeItem(KEY)}catch(x){}
      unlocked();return}
    try{const k=await derive(p1,fromB64(vt.salt),vt.iter||ITER);const o=await unseal(k,vt.iv,vt.ct);KEYOBJ=k;SALT=fromB64(vt.salt);S=Object.assign(blank(),o);fails=0;unlocked()}
    catch(x){fails++;$('#lp1').value='';if(fails>=5){blockedUntil=Date.now()+30000;fails=0;err(t('waitTry'))}else err(t('wrongPin'))}
  };
}
function unlocked(){$('#lock').hidden=true;$('#lkF').innerHTML='';LANG=S.lang;ACT='me';SHM=null;migrate();PS=S;if(pendingJoin)setTimeout(joinSheet,300);if(pendingShare){const txt=pendingShare;pendingShare=null;setTimeout(()=>quickFromText(txt),350)}render();runRecurring();maybeUpdateRates();writeReminders();loadRT().then(async()=>{if(PENDING_RT&&KEYOBJ){RT=PENDING_RT;PENDING_RT=null;await saveRT()}
    if(FRESH_DRIVE&&drv.linked){FRESH_DRIVE=false;try{const f=await ensureFolder();const has=(await driveList(f,5)).some(x=>!x.name.startsWith('receipt_'));if(has){toast(t('foundBackup'));driveRestore()}else syncDrive(true)}catch(e){}}
    if(drv.linked&&useWorker()&&!RT&&!hasToken()&&S){drv.needAuth=true;render()}})}
function lockNow(){clearTimeout(bkTimer);if(ACT!=='me'&&shDirty)shPush();stopPoll();ACT='me';SHM=null;PS=null;closeSheet();S=null;KEYOBJ=null;SALT=null;RT=null;$('#view').innerHTML='';showLock()}
$('#lkForgot').onclick=()=>{
  $('#lkT').textContent=t('forgotConfirm');$('#lkH').textContent='';$('#lkE').textContent='';$('#lkForgot').hidden=true;
  $('#lkF').innerHTML=`<div class="foot"><button type="button" class="btn grow" id="fNo">${t('cancel')}</button><button type="button" class="btn grow" id="fYes" style="background:var(--neg);border-color:var(--neg);color:#fff">${t('del')}</button></div>`;
  $('#fNo').onclick=showLock;
  $('#fYes').onclick=()=>{try{localStorage.removeItem(VAULT);localStorage.removeItem(KEY);localStorage.removeItem('daftari-rt');localStorage.removeItem('daftari-gtoken')}catch(e){}showLock()};
};
$('#lockBtn').onclick=()=>{if(S)lockNow()};
$('#brand').onclick=()=>{if(S&&PS)ledgersSheet()};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now()}
  else if(S&&hiddenAt&&Date.now()-hiddenAt>60000){lockNow()}
});

if(!(window.crypto&&crypto.subtle)){$('#lkT').textContent='This browser cannot encrypt data. Open the app over https.';}
else showLock();
})();
